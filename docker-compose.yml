# Local Postgres for development (matches the URL in .env.example).
#   docker compose up -d db   # start it
#   npm run setup             # generate client + apply migrations + seed
services:
  db:
    image: postgres:16-alpine
    container_name: finbud-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: finbud
      POSTGRES_PASSWORD: finbud
      POSTGRES_DB: finbud
    ports:
      - "5432:5432"
    volumes:
      - finbud-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finbud"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  finbud-db-data:
